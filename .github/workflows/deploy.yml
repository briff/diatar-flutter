name: Deploy

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      channel:
        description: 'Deploy channel'
        required: true
        type: choice
        options:
          - release
          - beta
          - web

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  detect:
    name: Detect channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.d.outputs.channel }}
    steps:
      - name: Determine deploy channel
        id: d
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
          elif echo "${{ github.ref_name }}" | grep -q '\-rc'; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
          else
            echo "channel=ci" >> "$GITHUB_OUTPUT"
          fi

  bump:
    name: Bump build number (${{ matrix.app }})
    needs: detect
    if: (needs.detect.outputs.channel == 'release' || needs.detect.outputs.channel == 'beta') && github.event_name != 'release'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump build number and push
        env:
          PUSH_BRANCH: ${{ startsWith(github.ref, 'refs/tags/') && (github.event.repository.default_branch || 'main') || github.ref_name }}
        run: |
          set -euo pipefail
          APP_DIR="${{ matrix.app }}"
          PUBSEC="$APP_DIR/pubspec.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          max_retries=10
          success=0
          for i in $(seq 1 $max_retries); do
            line=$(grep -E '^version:' "$PUBSEC")
            base=$(echo "$line" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+).*/\1/')
            current=$(echo "$line" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+).*/\2/')
            new=$((current + 1))
            sed -E "s/^version:.*/version: $base+$new/" "$PUBSEC" > "$PUBSEC.tmp" && mv "$PUBSEC.tmp" "$PUBSEC"
            git add "$PUBSEC"
            git commit -m "ci: bump build number to $new [skip ci]"
            if git push origin "HEAD:$PUSH_BRANCH"; then
              echo "Pushed build number bump to $new on $PUSH_BRANCH"
              success=1
              break
            fi
            echo "Push failed (attempt $i/$max_retries), syncing and retrying..."
            git fetch origin "$PUSH_BRANCH"
            git reset --hard "origin/$PUSH_BRANCH"
          done

          if [ "$success" -ne 1 ]; then
            echo "Failed to push the build number bump after $max_retries attempts"
            exit 1
          fi

  build-web:
    name: Build Web (${{ matrix.app }})
    needs: [detect, bump]
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.result == 'success' && (github.event.repository.default_branch || 'main') || github.ref_name }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Determine base-href
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_LC=$(echo '${{ matrix.app }}' | tr '[:upper:]' '[:lower:]')
          CNAME=$(gh api "repos/${{ github.repository }}/pages" --jq '.cname' 2>/dev/null || echo "")
          if [ -n "$CNAME" ]; then
            echo "Custom domain detected ($CNAME) -> root-relative base"
            echo "base_href=/$APP_LC/" >> "$GITHUB_OUTPUT"
          else
            echo "No custom domain -> repo-relative base"
            echo "base_href=/${{ github.event.repository.name }}/$APP_LC/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Web
        working-directory: ${{ matrix.app }}
        run: flutter build web --release --base-href="${{ steps.base.outputs.base_href }}"

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-web
          path: ${{ matrix.app }}/build/web
          if-no-files-found: error

  build-android:
    name: Build Android (${{ matrix.app }})
    needs: [detect, bump]
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.result == 'success' && (github.event.repository.default_branch || 'main') || github.ref_name }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: ${{ matrix.app }}
        run: |
          max_retries=3
          for i in $(seq 1 $max_retries); do
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$i" -eq "$max_retries" ]; then
              echo "Android build failed after $max_retries attempts"
              exit 1
            fi
            echo "Android build failed (attempt $i/$max_retries), clearing Gradle module cache and retrying..."
            rm -rf "$HOME/.gradle/caches/modules-2"
            sleep 15
          done

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-android-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.app }})
    needs: [detect, bump]
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.result == 'success' && (github.event.repository.default_branch || 'main') || github.ref_name }}

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake libgtk-3-dev liblzma-dev libunwind-dev ninja-build \
            pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter Pub Get
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Build Linux (Release)
        working-directory: ${{ matrix.app }}
        run: flutter build linux --release

      - name: Package Linux Bundle
        working-directory: ${{ matrix.app }}/build/linux/x64/release
        run: tar -czf ../../../../${{ matrix.app }}-linux.tar.gz bundle

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-linux
          path: ${{ matrix.app }}/${{ matrix.app }}-linux.tar.gz
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux arm64 (${{ matrix.app }})
    needs: [detect, bump]
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.result == 'success' && (github.event.repository.default_branch || 'main') || github.ref_name }}

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake jq libgtk-3-dev liblzma-dev libunwind-dev ninja-build \
            pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter
        env:
          FLUTTER_STABLE_VERSION: 3.47.2
          FLUTTER_STABLE_COMMIT: d3b14c876900e553bc736ca19295fc09e3853e8e
        run: |
          rm -rf "$HOME/flutter"
          git init "$HOME/flutter"
          git -C "$HOME/flutter" remote add origin https://github.com/flutter/flutter.git
          # Flutter stable ${FLUTTER_STABLE_VERSION} pinned commit for reproducible Linux arm64 builds.
          git -C "$HOME/flutter" fetch --depth 1 origin "$FLUTTER_STABLE_COMMIT"
          # Fetch matching stable tag so Flutter can resolve semantic SDK version.
          git -C "$HOME/flutter" fetch --depth 1 origin "refs/tags/$FLUTTER_STABLE_VERSION:refs/tags/$FLUTTER_STABLE_VERSION"
          git -C "$HOME/flutter" checkout -B stable "$FLUTTER_STABLE_COMMIT"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/flutter/bin:$PATH"
          flutter precache --linux
          flutter --version

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter Pub Get
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Build Linux arm64 (Release)
        working-directory: ${{ matrix.app }}
        run: flutter build linux --release

      - name: Package Linux arm64 Bundle
        working-directory: ${{ matrix.app }}/build/linux/arm64/release
        run: tar -czf ../../../../${{ matrix.app }}-linux-arm64.tar.gz bundle

      - name: Upload Linux arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-linux-arm64
          path: ${{ matrix.app }}/${{ matrix.app }}-linux-arm64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows (${{ matrix.app }})
    needs: [detect, bump]
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.result == 'success' && (github.event.repository.default_branch || 'main') || github.ref_name }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter Pub Get
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Build Windows (Release)
        working-directory: ${{ matrix.app }}
        run: flutter build windows --release

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          $bundlePath = "${{ matrix.app }}/build/windows/x64/runner/Release"
          $zipPath = "${{ matrix.app }}/${{ matrix.app }}-windows.zip"
          Compress-Archive -Path "$bundlePath/*" -DestinationPath $zipPath -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: ${{ matrix.app }}/${{ matrix.app }}-windows.zip
          if-no-files-found: error

  build-ios:
    name: Build iOS (${{ matrix.app }})
    needs: [detect, bump]
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.result == 'success' && (github.event.repository.default_branch || 'main') || github.ref_name }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Flutter Pub Get
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Build iOS (no codesign)
        working-directory: ${{ matrix.app }}
        run: flutter build ios --release --no-codesign

      - name: Package iOS App Bundle
        shell: pwsh
        run: |
          $appPath = "${{ matrix.app }}/build/ios/iphoneos"
          $zipPath = "${{ matrix.app }}-ios-nosign.zip"
          Compress-Archive -Path "$appPath/*" -DestinationPath $zipPath -Force

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ios-nosign
          path: ${{ matrix.app }}-ios-nosign.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.app }})
    needs: [detect, bump]
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.result == 'success' && (github.event.repository.default_branch || 'main') || github.ref_name }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Flutter Pub Get
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Build macOS (no codesign)
        working-directory: ${{ matrix.app }}
        run: flutter build macos --release

      - name: Package macOS App
        shell: pwsh
        run: |
          $appPath = "${{ matrix.app }}/build/macos/Build/Products/Release"
          $zipPath = "${{ matrix.app }}/${{ matrix.app }}-macos.zip"
          Compress-Archive -Path "$appPath/*" -DestinationPath $zipPath -Force

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-macos
          path: ${{ matrix.app }}/${{ matrix.app }}-macos.zip
          if-no-files-found: error

  build-tvos:
    name: Build tvOS (DiaVetito)
    needs: [detect, bump]
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.result == 'success' && (github.event.repository.default_branch || 'main') || github.ref_name }}

      - name: Setup flutter-tvos
        run: |
          git clone --depth 1 --branch v3.47.2-tvos.1.10.0 https://github.com/fluttertv/flutter-tvos.git "$HOME/flutter-tvos"
          echo "$HOME/flutter-tvos/bin" >> "$GITHUB_PATH"

      - name: Flutter-tvos pub get
        working-directory: DiaVetito
        run: flutter-tvos pub get

      - name: Build tvOS release (unsigned)
        working-directory: DiaVetito
        run: |
          python3 - <<'PY'
          path = "tvos/Runner.xcodeproj/project.pbxproj"
          with open(path) as f:
              content = f.read()
          content = content.replace(
              "DEVELOPMENT_TEAM = 3K775ZSA59;",
              "CODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tDEVELOPMENT_TEAM = 3K775ZSA59;"
          )
          with open(path, "w") as f:
              f.write(content)
          PY
          flutter-tvos build tvos --release

      - name: Package tvOS app bundle
        run: |
          cd DiaVetito/build/tvos/Release-appletvos
          zip -r -y -X "$GITHUB_WORKSPACE/DiaVetito-tvos-nosign.zip" Runner.app

      - name: Upload tvOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiaVetito-tvos-nosign
          path: DiaVetito-tvos-nosign.zip
          if-no-files-found: error

  deploy-android:
    name: Deploy Android (${{ matrix.app }})
    needs: [detect, bump]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/') && (github.event.repository.default_branch || 'main') || github.ref_name }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ${{ matrix.app }}/android

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ matrix.app }}/android/app/keystore.jks
          cd ${{ matrix.app }}/android
          echo "storeFile=keystore.jks" > key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> key.properties

      - name: Decode Play Store JSON key
        run: |
          echo '${{ secrets.PLAY_STORE_JSON_KEY }}' > ${{ matrix.app }}/android/play_store_key.json

      - name: Fastlane Deploy
        working-directory: ${{ matrix.app }}/android
        env:
          PLAY_STORE_JSON_KEY_FILE: play_store_key.json
        run: bundle exec fastlane ${{ needs.detect.outputs.channel == 'beta' && 'beta' || 'deploy' }}

  deploy-ios:
    name: Deploy iOS (${{ matrix.app }})
    needs: [detect, bump, build-ios]
    if: always() && needs.build-ios.result == 'success' && needs.detect.outputs.channel != 'ci'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/') && (github.event.repository.default_branch || 'main') || github.ref_name }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ${{ matrix.app }}/ios

      - name: Install fastlane
        run: sudo gem install fastlane

      - name: Download unsigned iOS build
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.app }}-ios-nosign
          path: ${{ matrix.app }}/ios/

      - name: Decode App Store Connect API key
        run: |
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 -d > ${{ matrix.app }}/ios/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Fastlane Deploy
        working-directory: ${{ matrix.app }}/ios
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_FILEPATH: AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: fastlane ${{ needs.detect.outputs.channel == 'beta' && 'beta' || 'deploy' }}

  deploy-tvos:
    name: Deploy tvOS to TestFlight / App Store
    needs: [detect, bump, build-tvos]
    if: always() && needs.build-tvos.result == 'success' && needs.detect.outputs.channel != 'ci'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/') && (github.event.repository.default_branch || 'main') || github.ref_name }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install fastlane
        run: sudo gem install fastlane

      - name: Download unsigned tvOS build
        uses: actions/download-artifact@v4
        with:
          name: DiaVetito-tvos-nosign
          path: DiaVetito/tvos/

      - name: Decode App Store Connect API key
        run: |
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 -d > DiaVetito/tvos/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Fastlane Deploy
        working-directory: DiaVetito/tvos
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_FILEPATH: AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: fastlane ${{ needs.detect.outputs.channel == 'beta' && 'beta' || 'deploy' }}

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [detect, build-web, build-android, build-linux, build-linux-arm64, build-windows]
    if: >-
      always() &&
      needs.build-web.result == 'success' &&
      (needs.detect.outputs.channel == 'web' || needs.detect.outputs.channel == 'release')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (for static landing page)
        uses: actions/checkout@v4

      - name: Download Diatar Web Build
        uses: actions/download-artifact@v4
        with:
          name: Diatar-web
          path: deploy/diatar

      - name: Download DiaVetito Web Build
        uses: actions/download-artifact@v4
        with:
          name: DiaVetito-web
          path: deploy/diavetito

      - name: Download Diatar Android APK
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Diatar-android-apk
          path: deploy/downloads/Diatar

      - name: Download Diatar Linux Bundle
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Diatar-linux
          path: deploy/downloads/Diatar

      - name: Download Diatar Linux arm64 Bundle
        if: needs.build-linux-arm64.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Diatar-linux-arm64
          path: deploy/downloads/Diatar

      - name: Download Diatar Windows Bundle
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Diatar-windows
          path: deploy/downloads/Diatar

      - name: Rename Diatar APK
        if: needs.build-android.result == 'success'
        run: mv deploy/downloads/Diatar/app-release.apk deploy/downloads/Diatar/Diatar.apk

      - name: Download DiaVetito Android APK
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: DiaVetito-android-apk
          path: deploy/downloads/DiaVetito

      - name: Download DiaVetito Linux Bundle
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: DiaVetito-linux
          path: deploy/downloads/DiaVetito

      - name: Download DiaVetito Linux arm64 Bundle
        if: needs.build-linux-arm64.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: DiaVetito-linux-arm64
          path: deploy/downloads/DiaVetito

      - name: Download DiaVetito Windows Bundle
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: DiaVetito-windows
          path: deploy/downloads/DiaVetito

      - name: Rename DiaVetito APK
        if: needs.build-android.result == 'success'
        run: mv deploy/downloads/DiaVetito/app-release.apk deploy/downloads/DiaVetito/DiaVetito.apk

      - name: Copy static landing page
        run: cp -r static/* deploy/

      - name: Build and Deploy Documentation
        run: |
          pip install mkdocs
          mkdocs build -d deploy/docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release-assets:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: [build-android, build-linux, build-linux-arm64, build-windows, build-ios, build-macos, build-tvos]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Upload Assets To GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.apk
            dist/**/*.tar.gz
            dist/**/*.zip
